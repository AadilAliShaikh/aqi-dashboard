name: Keep Render backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          echo "Pinging at $(date -u)"
          curl -fsS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://aqi-dashboard-segd.onrender.com/api/health
